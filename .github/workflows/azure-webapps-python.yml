name: Build and deploy ADCOP to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Validate Python source
        run: |
          python -m compileall -q simulate.py adcop
          PYTHONPATH=".python_packages/lib/site-packages" python -c "import simulate; assert not simulate.validate_graph()"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: adcop-python-app
          path: |
            .
            !.git/**
            !.github/**
            !.venv/**
            !venv/**
            !**/__pycache__/**
            !**/*.sqlite3*
            !.env*
            !**/.env*
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: none
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: adcop-python-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
          startup-command: bash startup.sh
