name: Build and deploy ADCOP to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-adcop-production
  cancel-in-progress: false

env:
  APP_DIR: adcop_prototype/adcop_prototype

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Install dependencies (validation only)
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python source
        working-directory: ${{ env.APP_DIR }}
        run: |
          source .venv/bin/activate
          python -m compileall -q simulate.py adcop
          python -c "import simulate; assert not simulate.validate_graph()"

      - name: Create deployment package
        working-directory: ${{ env.APP_DIR }}
        run: |
          zip -r "$GITHUB_WORKSPACE/release.zip" . \
            -x ".venv/*" ".git/*" "*/__pycache__/*" "__pycache__/*" \
               "*.sqlite3*" ".env*" "*/.env*"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: adcop-python-app
          path: release.zip
          if-no-files-found: error
        
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: none
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: adcop-python-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: release.zip
          startup-command: bash startup.sh
